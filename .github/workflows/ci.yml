name: ci

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # packages/db runs `prisma generate` as a postinstall, and its
      # prisma.config.ts resolves DATABASE_URL eagerly. Generation never opens a
      # connection — the value only has to parse — so a placeholder is enough
      # to keep the install from failing on a runner with no .env.
      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://localhost:5432/dm_forge_ci
        run: pnpm install --frozen-lockfile

      # The whole `unit:*` pyramid base, which is what makes the log-scrub rules
      # (NFR-003, Tech Design §10.1) a merge gate rather than a local habit: a
      # regex loosened until a token slips through fails the PR that loosened it.
      # No Docker and no database — integration tests are a separate suite.
      - name: Run unit tests
        run: pnpm test
