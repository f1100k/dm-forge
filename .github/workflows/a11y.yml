name: a11y

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  axe:
    name: axe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # --ignore-scripts skips packages/db's `prisma generate` postinstall,
      # which these tests do not need — they never reach the database. It also
      # sidesteps a latent break: that postinstall crashes with ERR_REQUIRE_ESM
      # on the Node version .nvmrc pins (v22.11.0, before require(ESM) landed
      # unflagged in 22.12). Any future job that *does* need the Prisma client
      # will have to fix that first — bump .nvmrc or bump prisma.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The a11y files run under happy-dom + MSW, so this job needs no Docker
      # and no database — unlike the rest of the integration suite. A failure
      # names the violated rule, its impact, the offending selector, and the
      # Deque docs URL (tests/helpers/harness/a11y.ts).
      - name: Run axe accessibility checks
        run: pnpm --filter @dm-forge/tests test:a11y
