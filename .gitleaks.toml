# Gitleaks configuration — allowlist for known false positives.
# Reviewed monthly — see the accounting runbook in docs/devex/secret-scanning.md.

[extend]
useDefault = true

[allowlist]
paths = [
  '''\.env\.example$''',
]
regexes = [
  # Dummy BYOK key used in encryption round-trip tests
  '''sk-or-v1-abcdef0123456789''',

  # Fixtures in packages/shared/src/logging/scrub.test.ts. That suite proves the
  # log scrubber masks each credential shape (NFR-003), so it can only be written
  # with strings that look like the real thing — every value below is synthetic
  # and was never issued by any provider. Listed as exact literals rather than
  # excluding the file, so a genuine secret pasted there would still be caught.
  #
  # Session-token JWT
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiJ1c3JfMSIsImlhdCI6MTcwMDAwMDAwMH0\.dBjftJeZ4CVPmB92K27uhbUJU1p1r_wW1gFWFOEjXkQ''',
  # 64-char hex standing in for a reset token / SHA-256 digest
  '''a3f5c1e2b4d6a8f0c2e4b6d8a0f2c4e6b8d0a2f4c6e8b0d2a4f6c8e0b2d4a6f8''',
  # Cookie value in the session-cookie masking test (matched as the extracted
  # secret, which is the value alone rather than the whole Cookie header)
  '''abc123def456''',
  # OpenRouter BYOK key shape
  '''sk-or-v1-9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a''',
  # Resend API key shape
  '''re_A1b2C3d4E5f6G7h8I9j0K1''',
  # GitHub personal access token shape
  '''ghp_A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8''',
  # Google OAuth client secret shape
  '''GOCSPX-A1b2C3d4E5f6G7h8I9j0''',
]
